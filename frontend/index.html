<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="A study assistant for IT and engineering students, by Harsh Mandaliya." />
    <meta name="theme-color" content="#fbf8f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151311" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Nova · AI Study Assistant</title>
    <script>
      // Set the theme before first paint so there's no flash.
      try {
        const t = localStorage.getItem('chat.theme')
        document.documentElement.dataset.theme =
          t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.dataset.font = localStorage.getItem('chat.font') || 'sans'
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
